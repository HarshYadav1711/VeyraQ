[project]
name = "veyraq-backend"
version = "0.1.0"
description = "VeyraQ FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.141.1,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "SQLAlchemy>=2.0.53,<2.1",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.20,<2",
  "langgraph>=1.2.11,<2",
  "groq>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
